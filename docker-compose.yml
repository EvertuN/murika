services:
  php:
    build: .
    container_name: meu_php
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_USER: everton
      MYSQL_ROOT_PASSWORD: arikas123
      MYSQL_DATABASE: murika
      MYSQL_PASSWORD: arikas123
    ports:
      - "6000:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: meu_phpmyadmin
    restart: always
    ports:
      - "5000:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: